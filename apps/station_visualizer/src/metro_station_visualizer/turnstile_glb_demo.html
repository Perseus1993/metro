<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Turnstile GLB Simulation Demo</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, Arial, Helvetica, sans-serif;
        background: #eef2f4;
        color: #182128;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      #turnstileGlbScene {
        display: block;
        width: 100vw;
        height: 100vh;
      }

      .hud {
        position: fixed;
        top: 14px;
        left: 14px;
        right: 14px;
        display: grid;
        grid-template-columns: minmax(220px, 1fr) auto;
        gap: 10px;
        align-items: center;
        pointer-events: none;
      }

      .hud__title,
      .hud__controls,
      .stats {
        border: 1px solid rgba(26, 38, 48, 0.14);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.9);
        box-shadow: 0 12px 30px rgba(23, 35, 44, 0.1);
        pointer-events: auto;
      }

      .hud__title {
        min-width: 0;
        padding: 10px 12px;
      }

      .hud__title strong,
      .stat strong {
        display: block;
        color: #182128;
        font-size: 15px;
        font-weight: 740;
        line-height: 1.2;
      }

      .hud__title span,
      .stat span {
        display: block;
        margin-top: 2px;
        color: #64707a;
        font-size: 11px;
        line-height: 1.2;
      }

      .hud__controls {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 8px;
      }

      button,
      select,
      input {
        height: 34px;
        border: 1px solid #b9c5ce;
        border-radius: 6px;
        background: #ffffff;
        color: #182128;
        font: inherit;
      }

      button {
        min-width: 38px;
        cursor: pointer;
      }

      select {
        max-width: 280px;
        padding: 0 28px 0 9px;
      }

      input[type="range"] {
        width: min(38vw, 360px);
      }

      .stats {
        position: fixed;
        right: 14px;
        bottom: 14px;
        display: grid;
        grid-template-columns: repeat(5, minmax(72px, 1fr));
        gap: 1px;
        overflow: hidden;
      }

      .stat {
        min-width: 0;
        padding: 9px 10px;
        background: rgba(255, 255, 255, 0.82);
      }

      .status {
        position: fixed;
        left: 14px;
        bottom: 14px;
        max-width: min(480px, calc(100vw - 28px));
        padding: 9px 11px;
        border-radius: 8px;
        background: rgba(24, 33, 40, 0.84);
        color: #ffffff;
        font-size: 12px;
        line-height: 1.35;
      }

      @media (max-width: 760px) {
        .hud {
          grid-template-columns: 1fr;
        }

        .hud__controls {
          flex-wrap: wrap;
        }

        input[type="range"] {
          width: 100%;
          flex-basis: 100%;
        }

        .stats {
          left: 14px;
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }

        .status {
          bottom: 124px;
        }
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://esm.sh/three@0.165.0",
          "three/addons/loaders/GLTFLoader.js": "https://esm.sh/three@0.165.0/examples/jsm/loaders/GLTFLoader.js?external=three",
          "three/addons/utils/SkeletonUtils.js": "https://esm.sh/three@0.165.0/examples/jsm/utils/SkeletonUtils.js?external=three"
        }
      }
    </script>
  </head>
  <body>
    <canvas id="turnstileGlbScene"></canvas>
    <section class="hud" aria-label="Turnstile GLB controls">
      <div class="hud__title">
        <strong>单闸机 GLB 仿真</strong>
        <span id="runLabel">loading</span>
      </div>
      <div class="hud__controls">
        <select id="runSelect" aria-label="Run"></select>
        <button id="playButton" type="button" aria-label="Play or pause">⏸</button>
        <select id="speedSelect" aria-label="Speed">
          <option value="0.5">0.5x</option>
          <option value="1" selected>1x</option>
          <option value="2">2x</option>
          <option value="4">4x</option>
        </select>
        <input id="timeline" type="range" min="0" value="0" step="0.01" aria-label="Timeline" />
      </div>
    </section>
    <section class="stats" aria-label="Turnstile stats">
      <div class="stat"><strong id="activeValue">0</strong><span>active</span></div>
      <div class="stat"><strong id="queueValue">0</strong><span>queue</span></div>
      <div class="stat"><strong id="serviceValue">0</strong><span>service</span></div>
      <div class="stat"><strong id="sinkValue">0</strong><span>sink</span></div>
      <div class="stat"><strong id="clockValue">0s</strong><span>time</span></div>
    </section>
    <div id="statusLine" class="status">GLB loading</div>
    <script type="module" src="./assets/turnstile_glb_scene.js?v=glb-demo-2"></script>
  </body>
</html>
