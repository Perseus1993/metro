name: Cross-layout maturity

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:
    inputs:
      tier:
        description: Acceptance tier
        type: choice
        required: true
        default: release
        options:
          - geometry
          - trajectory
          - smoke
          - nightly
          - release

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install uv
      - run: uv sync --locked --all-extras --all-packages
      - run: uv run --no-sync ruff check apps experiments packages quality sandbox scripts src tests
      - run: uv run --no-sync lint-imports
      - run: uv run --no-sync pyright packages/metro_station/src/metro_station/domain packages/metro_station/src/metro_station/application tests/test_official_metro_station_package.py
      - run: uv build --all-packages
      - run: uv run --no-sync pytest -q

  geometry-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install uv
      - run: uv sync --locked --all-extras --all-packages
      - name: Run generated geometry matrix
        run: >-
          uv run --no-sync python scripts/run_layout_acceptance.py
          --tier geometry
          --output-json output/layout_acceptance/geometry-report.json
          --output-markdown output/layout_acceptance/geometry-report.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: layout-acceptance-geometry
          path: output/layout_acceptance/

  layout-acceptance:
    if: >-
      github.event_name != 'workflow_dispatch' ||
      (inputs.tier != 'geometry' && inputs.tier != 'trajectory')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ACCEPTANCE_TIER: ${{ github.event_name == 'schedule' && 'nightly' || inputs.tier || 'smoke' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install uv
      - run: uv sync --locked --all-extras --all-packages
      - run: uv run --no-sync python scripts/run_layout_acceptance.py --tier "$ACCEPTANCE_TIER"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: layout-acceptance-${{ env.ACCEPTANCE_TIER }}
          path: output/layout_acceptance/

  trajectory-acceptance:
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.tier == 'trajectory')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install uv
      - run: uv sync --locked --all-extras --all-packages
      - name: Run generated trajectory matrix
        run: >-
          uv run --no-sync python scripts/run_layout_acceptance.py
          --tier trajectory
          --output-json output/layout_acceptance/trajectory-report.json
          --output-markdown output/layout_acceptance/trajectory-report.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: layout-acceptance-trajectory
          path: output/layout_acceptance/
