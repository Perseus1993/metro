[project]
name = "metro-alignment"
version = "0.1.0"
description = "Open pedestrian dataset alignment and parameter calibration for metro station simulation"
requires-python = ">=3.12"
dependencies = [
    "pedpy>=1.4.0",
    "pandas>=2.0",
    "pyarrow>=15.0",
    "numpy>=1.26",
    "shapely>=2.0",
    "matplotlib>=3.8",
    "requests>=2.31",
    "tqdm>=4.66",
    "pydantic>=2.0",
    "metro-station",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/metro_alignment"]

[tool.uv.sources]
metro-station = { path = "../packages/metro_station", editable = true }
metro-data-warehouse = { path = "..", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
